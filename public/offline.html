<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F1F4EC" />
  <title>Sedang offline | CuanKit</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F1F4EC; color: #1E2A1F; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 360px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 12px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #5B6358; margin: 0 0 20px; }
    button { background: #2F5233; color: #F1F4EC; border: 0; border-radius: 4px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="CuanKit" />
    <h1>Kamu sedang offline</h1>
    <p>CuanKit butuh koneksi internet untuk membuka halaman. Sambungkan internet, lalu coba lagi. Angka yang sudah kamu simpan di Usaha Saya tetap aman di perangkat ini.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
